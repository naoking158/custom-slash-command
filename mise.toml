[tools]
bats = "1.14.0"
shellcheck = "0.11.0"

[tasks.test]
description = "Run every bats suite with the bash on PATH, and again with /bin/bash when its version differs"
run = "tests/run.sh"

[tasks.lint]
description = "shellcheck the tracked .sh and .bash files and orca/bin"
run = "git ls-files -z '*.sh' '*.bash' 'orca/bin/*' | xargs -0 shellcheck -S warning"
