[tools]
bats = "1.14.0"
shellcheck = "0.11.0"
go = "1.27.4"

[tasks.test]
description = "Run every bats suite with the bash on PATH, and again with /bin/bash when its version differs, then go test"
run = "tests/run.sh"

[tasks."test:parallel"]
description = "Run every test once with the bash on PATH, bats tests and go test in parallel"
run = "tests/all-parallel.sh"

[tasks.lint]
description = "shellcheck the tracked .sh and .bash files and orca/bin, vet and gofmt the Go code, and check that bin/ is built from it"
run = [
  "git ls-files -z '*.sh' '*.bash' 'orca/bin/*' | xargs -0 shellcheck -S warning",
  "go vet ./...",
  "test -z \"$(gofmt -l cmd internal)\" || { gofmt -l cmd internal; exit 1; }",
  "scripts/build-bin.sh && git diff --exit-code --stat -- bin/",
]
