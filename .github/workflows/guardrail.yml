name: Guardrail

# pull_request_target runs this file and scripts/ci/guardrail.sh as they are on
# the base branch, so a pull request cannot rewrite the check that judges it.
# Its token only reads, and no cache is read or written. The job never runs
# the pull request's code: for the outbound-guard exception it fetches the
# head, reads its source and builds bin/ from it, and reads CI's test results
# for it (see guardrail.sh). Runs are not cancelled: scripts/lib/wait-ci.sh
# counts a cancelled run as red.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: go
          cache: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/guardrail.sh gate "$GITHUB_REPOSITORY" "$PR"
