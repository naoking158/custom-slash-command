name: Guardrail

# pull_request_target runs this file and scripts/ci/guardrail.sh as they are on
# the base branch, so a pull request cannot rewrite the check that judges it.
# The job never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: guardrail-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: scripts/ci/guardrail.sh gate "$GITHUB_REPOSITORY" "$PR" "$ACTION"
