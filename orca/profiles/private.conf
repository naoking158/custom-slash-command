# Role-to-harness profile for the private machine.
# Format: <role> <harness> <model>, one role per line. Harness is an Orca agent id;
# model is an `agy models` slug (all three below are listed by agy 1.5.18).
# orca/bin/start-goal reads the implement line. The agents (verify, review,
# adversary, audit) run as agy subagents that inherit the session's model, so
# their lines record the intended model rather than set it.
# - gemini-4-neon-medium: the default for implementing, checking and retro.
# - gemini-4-hydrogen-high: research and simple tasks (scout).
# - gemini-4-carbon-medium: a spot consultation on a hard task, such as
#   `agy -p --model gemini-4-carbon-medium "<question>"` for a design choice.
implement    antigravity   gemini-4-neon-medium
verify       antigravity   gemini-4-neon-medium
review       antigravity   gemini-4-neon-medium
scout        antigravity   gemini-4-hydrogen-high
retro        antigravity   gemini-4-neon-medium
adversary    antigravity   gemini-4-neon-medium
audit        antigravity   gemini-4-neon-medium
consult      antigravity   gemini-4-carbon-medium
