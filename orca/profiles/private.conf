# Role-to-harness profile for the private machine.
# Format: <role> <harness> <model>, one role per line. Harness is an Orca agent id;
# model is an `agy models` slug, passed to `orca orchestration worker-start --model` as is.
# gemini-4-carbon-high は agy 1.5.18 の `agy models` にある slug（agy の Orchestrator
# が planner に使うモデル）。
implement    antigravity   gemini-4-carbon-high
verify       antigravity   gemini-4-carbon-high
review       antigravity   gemini-4-carbon-high
scout        antigravity   gemini-3.8-flash-medium
retro        antigravity   gemini-4-carbon-high
adversary    antigravity   gemini-4-carbon-high
audit        antigravity   gemini-4-carbon-high
