# Role-to-harness profile for the work machine.
# Format: <role> <harness> <model>, one role per line. Harness is an Orca agent id;
# model is passed to `orca orchestration worker-start --model` as is.
implement    claude        opus
verify       claude        opus
review       claude        opus
scout        claude        haiku
retro        claude        sonnet
# adversary (my:adversary) and audit (my:trail-auditor) fall back to the review
# line when absent. A machine with another harness can point them at a
# different vendor's model for a cross-model check.
adversary    claude        opus
audit        claude        opus
